# The three gates, on GitLab. `.github/workflows/ci.yml` does not run here; it is
# kept so the repository can move back or mirror without losing it.
#
# No `allow_failure` on any gate (story 1.1). A pipeline that can go green with a
# failing test is worse than no pipeline, because it is believed.

stages: [verify]

# One pipeline per change, not two. Without this, a push to a branch with an open
# merge request creates a `push` pipeline *and* a `merge_request_event` pipeline
# on the same commit -- every commit on story 1.6b was billed twice.
workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == 'merge_request_event'
    - if: $CI_COMMIT_BRANCH == 'main'
    - when: never

default:
  image: node:24
  # Lockfile-exact install, cache keyed on the lockfile so a dependency change
  # cannot be served a stale tree.
  cache:
    key:
      files: [package-lock.json]
    paths: [.npm/]
  before_script:
    - npm ci --cache .npm --prefer-offline

verify:
  stage: verify
  script:
    - npm run lint
    - npm run build
    # The whole suite, on merge requests as well as main. Two attempts at making
    # this cheaper were both wrong: dropping `npm test` left no gate at all, and
    # running the suite only on `main` was post-merge detection, because
    # CI_COMMIT_BRANCH is unset in a merge-request pipeline.
    #
    # The suite was never the cost. Measured on story 1.6b: ~46s of a job is
    # `npm ci` plus the image pull, against ~25s for the whole suite. The money
    # went on two pipelines per commit, fixed by `workflow` above.
    #
    # core/security within it carries the NFR-2 assertion AD-2 requires of CI: no
    # banking, payment-processor or external-accounting credential in this deploy
    # unit. If it fails, remove the credential -- removing the check is an
    # architecture change, not a fix.
    - npm test

  rules:
    - if: $CI_COMMIT_BRANCH == 'main'
    - if: $CI_PIPELINE_SOURCE == 'merge_request_event'

# Path-based skipping was tried here and removed. It leaked three times in three
# review rounds: first `.env*`, which the NFR-2 guard reads and is exactly the
# change that must never skip, then `.github/`, `.claude/` and `_bmad/`. The rule
# was a positive one -- run `verify` when a listed path changed -- so every gap in
# the list failed *open* and in silence, and a skipped job looks the same as a
# passing one on the merge request page. (`changes` with `when: never` can express
# the inverse; that is not what was written here, and inverting it only moves the
# gaps.)

# The database and storage tests need live credentials, so they cannot run on a
# fork or an untrusted pipeline. Opt-in: define WATCHDOG_WRITER_DATABASE_URL and
# WATCHDOG_READER_DATABASE_URL as *protected, masked* CI/CD variables.
#
# These are the tests that prove AD-4 -- that the SELECT-only role the LLM query
# path uses genuinely cannot write. Without them that guarantee is only asserted.
verify:database:
  stage: verify
  script:
    - npm run test:db
  rules:
    # Both URLs, not just the reader: the suite needs the writer connection too,
    # so gating on the reader alone lets the job start without what it requires
    # and fail, reporting a broken build where the honest outcome is "skipped".
    - if: $WATCHDOG_READER_DATABASE_URL && $WATCHDOG_WRITER_DATABASE_URL
      when: on_success
    - when: never

# The extraction probe calls the real provider. Opt-in on the same terms: define
# GEMINI_API_KEY and GEMINI_OCR_MODEL as *protected, masked* CI/CD variables.
#
# The only check that proves AD-9 end to end. Every unit test around the
# extraction adapter injects `fetch`, so together they show that this code sends a
# schema and revalidates the reply -- not that the provider honours the schema.
# Run locally on 2026-08-04 it asked for a documentKind of "receipt", which the
# vocabulary does not contain, and the provider returned "other".
verify:extraction:
  stage: verify
  script:
    - npm run verify:extraction
  rules:
    # Both names, for the reason verify:database gates on both of its own.
    - if: $GEMINI_API_KEY && $GEMINI_OCR_MODEL
      when: on_success
    - when: never
