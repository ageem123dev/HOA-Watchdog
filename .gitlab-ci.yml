# The three gates, on GitLab.
#
# `.github/workflows/ci.yml` does not run here — it is kept so the repository can
# move back or mirror without losing it, but GitLab reads this file.
#
# Story 1.1's rule stands: no `allow_failure` on any gate. A pipeline that can go
# green with a failing test is worse than no pipeline, because it is believed.

stages: [verify]

# One pipeline per change, not two.
#
# Without this, a push to a branch with an open merge request creates a `push`
# pipeline *and* a `merge_request_event` pipeline, both running the same jobs on
# the same commit. Every commit on story 1.6b was billed twice for identical
# work.
workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == 'merge_request_event'
    - if: $CI_COMMIT_BRANCH == 'main'
    - when: never

default:
  image: node:24
  # A lockfile-exact install, and the cache is keyed on it so a dependency change
  # cannot be served a stale tree.
  cache:
    key:
      files: [package-lock.json]
    paths: [.npm/]
  before_script:
    - npm ci --cache .npm --prefer-offline

verify:
  stage: verify
  script:
    - npm run lint
    - npm run build
    # The security suite only, not the whole of `npm test`.
    #
    # The full suite runs locally on every change, and paying a runner to repeat
    # ~1,100 tests that were green a minute earlier buys very little. What it did
    # buy is stated plainly below, because this is a real reduction and not a
    # free one.
    #
    # core/security/ stays, and is the reason this is not simply deleted.
    # nfr2-guard.test.ts asserts that no banking, payment-processor or external
    # accounting credential exists in this deploy unit's environment or tracked
    # configuration. NFR-2 by way of AD-2 ("the air-gap is an absence, not a
    # permission") names *a CI check* as the mechanism, so that assertion has to
    # run somewhere nobody can skip. If it fails, remove the credential —
    # removing the check is an architecture change, not a fix.
    #
    # What is given up: a test that passes on a developer's machine and fails on
    # a clean checkout — a missing file that only exists locally, a dependency
    # not in the lockfile — now reaches `main`. `npm ci` plus `npm run build`
    # still catch most of that shape, and `build` remains the only gate that
    # type-checks at all.
    - npm test -- core/security
  rules:
    - if: $CI_PIPELINE_SOURCE == 'merge_request_event'
    - if: $CI_COMMIT_BRANCH

# The database and storage tests need live credentials, so they cannot run on a
# fork or an untrusted pipeline. They are opt-in: define WATCHDOG_WRITER_DATABASE_URL
# and WATCHDOG_READER_DATABASE_URL as *protected, masked* CI/CD variables and this
# job runs on protected branches only.
#
# These are the tests that prove AD-4 — that the SELECT-only role the LLM query
# path uses genuinely cannot write. Without them that guarantee is only asserted.
verify:database:
  stage: verify
  script:
    - npm run test:db
  rules:
    # Both URLs, not just the reader. The suite needs the writer connection too,
    # so gating on the reader alone lets the job start without what it requires
    # and fail — reporting a broken build where the honest outcome is "skipped".
    - if: $WATCHDOG_READER_DATABASE_URL && $WATCHDOG_WRITER_DATABASE_URL
      when: on_success
    - when: never

# The extraction probe calls the real provider, so it needs a live credential and
# cannot run on a fork or an untrusted pipeline. Opt-in on the same terms as
# verify:database: define GEMINI_API_KEY and GEMINI_OCR_MODEL as *protected,
# masked* CI/CD variables and this job runs on protected branches only.
#
# This is the only check that proves AD-9 end to end. Every unit test around the
# extraction adapter injects `fetch`, so together they show that this code sends
# a schema and revalidates the reply — not that the provider honours the schema.
# The difference is the whole point: run locally on 2026-08-04 it asked for a
# documentKind of "receipt", which the vocabulary does not contain, and the
# provider returned "other". That is enforcement, not decoration.
verify:extraction:
  stage: verify
  script:
    - npm run verify:extraction
  rules:
    # Both names, for the reason verify:database gates on both of its own: the
    # script needs the model selector as well as the key, so gating on the key
    # alone lets the job start without what it requires and fail, reporting a
    # broken build where the honest outcome is "skipped".
    - if: $GEMINI_API_KEY && $GEMINI_OCR_MODEL
      when: on_success
    - when: never
