# The agent service: the second runtime, and the one that holds no data.
#
# AD-3 (amended 2026-08-10) - "The Python agent service holds exactly two
# secrets, the model API key and AD-15's gateway service token, and never a
# database credential, connection string, or storage key. It obtains every fact
# by calling Node's tool endpoints."
#
# AD-15 - it reaches Node only through the versioned /tools/* endpoints.

# Nixpacks installs this service with `pip install .`, which needs a build
# backend declared. Without one, pip falls back to a legacy path that is one
# deprecation away from failing a deploy for a reason nothing in this file
# explains.
#
# The package is still not *distributed* -- the service is deployed as a
# directory, and `pythonpath = ["."]` below is what the test suite runs against.
# This section exists so the dependency list in `[project]` stays the single
# source of truth for what gets installed; a requirements.txt would be a second
# list, and `tests/test_no_data_credentials.py` reads only this one.
[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["watchdog_agent"]

[project]
name = "watchdog-agent"
version = "0.1.0"
description = "The reasoning runtime. Holds the model key and the gateway token, and no data credential (AD-3)."

# The range AD-15 quotes from CrewAI's own `requires_python`, verbatim.
#
# The upper bound is the load-bearing half and it is not theoretical: the ambient
# interpreter on the development machine is 3.14.6, so `python3 -m venv` builds an
# environment CrewAI cannot be installed into, and nothing says so until story 3.4
# runs `pip install crewai`. Build the environment with `py -3.13 -m venv .venv`.
#
# `agent/tests/test_interpreter.py` asserts this range against the *running*
# interpreter as well as against this line, so the declaration and the reality
# cannot drift apart quietly.
requires-python = ">=3.10,<3.14"

# Anything added here is checked by `agent/tests/test_no_data_credentials.py`
# against an **allowlist**: a database driver or an object-storage client in this
# list is an AD-3 violation, because it is a way for this runtime to reach data
# directly. Adding a dependency is therefore a decision somebody makes in a diff.
#
# `crewai[google-genai]`, not bare `crewai`. Verified against the installed
# package rather than the documentation: 1.15.8 ships **no litellm**, and
# `LLM(model="gemini/...")` raises `ImportError: Google Gen AI native provider
# not available` without this extra. The public integration guidance still
# describes the litellm path, which is why this comment exists.
#
# `starlette` and `uvicorn` arrive transitively with crewai, and a transitive
# dependency is not a declared one — this list is what the allowlist checks, so
# using one means saying so. Starlette rather than FastAPI: AD-17's request must
# *refuse* fields rather than ignore them, which is a rule about what the schema
# rejects and is written by hand either way.
dependencies = [
    "crewai[google-genai]==1.15.8",
    "starlette>=1.6,<2",
    "uvicorn>=0.52,<1",
]

[project.optional-dependencies]
# `tomli` only below 3.11. The test suite reads this file to check the pin and
# the dependency list, and `tomllib` is 3.11+ - so on the 3.10 that
# `requires-python` admits, collection would fail on an import. Declaring the
# backport keeps the range AD-15 quotes from CrewAI true rather than aspirational.
# Raised by Argus and again by CodeRabbit; documented first, then fixed properly.
dev = ["pytest>=8", "tomli>=2 ; python_version < '3.11'"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Inside the venv, which is already ignored, so running the suite adds no
# untracked directory to the repository root. `.gitignore` carries an
# unrelated uncommitted change, and a build artefact is not a good reason to
# entangle it.
cache_dir = ".venv/.pytest_cache"
# Import the package from the source tree without an install step. The service is
# not distributed; it is deployed as a directory.
pythonpath = ["."]
