language: en
reviews:
  profile: assertive
  request_changes_workflow: false
  high_level_summary: true
  poem: false
  path_filters:
    # Story documents and sprint status: prose, no security surface.
    #
    # Exclusions only. If a filter list turns out to act as an allow-list instead,
    # this fails closed -- reviews would cover nothing -- so confirm the first
    # merge request after this change still reports code files reviewed.
    #
    # Nothing under .gitlab-ci.yml or this file belongs here. Rounds 7 and 8 of
    # story 1.6b were CodeRabbit catching that a CI path filter skipped `.env*`,
    # then `.claude/` and `_bmad/`. Muting review on CI config is how the next
    # such rule lands unnoticed.
    - "!_bmad-output/**"
  auto_review:
    enabled: true
    drafts: false
    # Counts commits, not review rounds. The default of 5 tripped part-way through
    # stories 1.5d and 1.6b, and a paused review is indistinguishable from a clean
    # one -- the false-clean the ship-story convergence rule refuses. 1.6b reached
    # 11 commits across 4 rounds, so 25 fires only on something genuinely stuck.
    # Not 0: a story that keeps finding defects in its own fixes should stop and
    # involve a human.
    auto_pause_after_reviewed_commits: 25
    base_branches:
      - main
  path_instructions:
    - path: "CLAUDE.md"
      instructions: "This file controls agent behavior (Claude Code). Review changes very carefully for conflicts with existing instructions."
    - path: "**/*.tsx"
      instructions: "Check for command injection, path traversal, and SSRF. Ensure scripts handle missing data/ directories gracefully."
chat:
  auto_reply: true
