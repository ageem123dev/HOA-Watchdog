language: en
reviews:
  profile: assertive
  request_changes_workflow: false
  high_level_summary: true
  poem: false
  auto_review:
    enabled: true
    drafts: false
    # 0 disables the pause. The default is 5: automatic reviews stop after five
    # reviewed commits on a branch until someone asks for one by hand.
    #
    # That default fits a branch that is pushed once and reviewed once. It does
    # not fit this pipeline, where a story answers each round of findings with a
    # fix push and every push is meant to draw a re-review. Stories 1.5d and
    # 1.6b both went quiet part-way through and needed `@coderabbitai review` to
    # restart — which reads exactly like "reviewed and clean" if you are not
    # watching for it, and that is the one failure mode the review loop must not
    # have.
    auto_pause_after_reviewed_commits: 0
    base_branches:
      - main
  path_instructions:
    - path: "CLAUDE.md"
      instructions: "This file controls agent behavior (Claude Code). Review changes very carefully for conflicts with existing instructions."
    - path: "**/*.tsx"
      instructions: "Check for command injection, path traversal, and SSRF. Ensure scripts handle missing data/ directories gracefully."
chat:
  auto_reply: true
