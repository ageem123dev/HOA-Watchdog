language: en
reviews:
  profile: assertive
  request_changes_workflow: false
  high_level_summary: true
  poem: false
  auto_review:
    enabled: true
    drafts: false
    # Automatic reviews pause after this many reviewed commits on a branch, until
    # somebody asks for one by hand. The default of 5 is too low for this
    # pipeline: a story answers each round of findings with a fix push, and every
    # push is meant to draw a re-review. Stories 1.5d and 1.6b both went quiet
    # part-way through and needed `@coderabbitai review` to restart.
    #
    # Why that is worse than a delay: a paused review looks exactly like a clean
    # one from outside. "No open findings" and "green pipeline" are both true
    # *before* any review has run, which is the false-clean the ship-story
    # convergence rule exists to refuse.
    #
    # Raised rather than disabled, deliberately. Zero removes the ceiling
    # entirely, and a story that keeps finding defects in its own fixes should
    # eventually stop and involve a human rather than loop forever.
    #
    # 25 because this counts *commits*, not review rounds, and the two are not
    # close. Story 1.6b reached 11 commits across 4 rounds — fix commits, a doc
    # clarification, config, each drawing its own re-review. A ceiling of 10
    # would already have tripped on a story that was converging normally, which
    # is a false alarm rather than a safety net. 25 is roughly double the worst
    # story so far, so it fires only on something genuinely stuck.
    auto_pause_after_reviewed_commits: 25
    base_branches:
      - main
  path_instructions:
    - path: "CLAUDE.md"
      instructions: "This file controls agent behavior (Claude Code). Review changes very carefully for conflicts with existing instructions."
    - path: "**/*.tsx"
      instructions: "Check for command injection, path traversal, and SSRF. Ensure scripts handle missing data/ directories gracefully."
chat:
  auto_reply: true
