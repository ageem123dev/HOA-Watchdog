# Team overrides for the bmad-code-review skill.
# Merged over .claude/skills/bmad-code-review/customize.toml by
# _bmad/scripts/resolve_customization.py. Arrays append; scalars override.
#
# This file exists to route the review's reasoning through the `argus` MCP server
# instead of Claude subagents. It is the update-durable half of that change: the
# edits to .claude/skills/bmad-code-review/steps/ are overwritten whenever BMad is
# reinstalled, but this file is not, and the routing contract it loads below
# re-establishes the behaviour on its own.

[workflow]

# Appends to the skill default. Loaded as foundational context on every activation.
persistent_facts = [
  "file:{project-root}/_bmad/custom/argus-review-routing.md",
]
